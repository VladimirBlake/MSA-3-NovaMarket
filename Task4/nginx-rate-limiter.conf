events {}
http {
    # Ключ для web
    map $http_client_type $web_key {
        web     $binary_remote_addr;
        default "";
    }

    # Ключ для mobile
    map $http_client_type $mobile_key {
        mobile  $binary_remote_addr;
        default "";
    }

    # Зоны
    limit_req_zone $web_key zone=web_zone:10m rate=50r/s;
    limit_req_zone $mobile_key zone=mobile_zone:10m rate=30r/s;

    upstream backend {
        server localhost:8081;
    }

    server {
        listen 80;

        location /api/ {

            limit_req zone=web_zone burst=100 nodelay;
            limit_req zone=mobile_zone burst=60 nodelay;

            proxy_pass http://backend;
        }
    }


    # Тестовый сервер для имитации бэкенда приложения
    server {
        listen 8081;
        
        location /api/ {
            add_header Content-Type application/json;
            
            # Эмулируем разное поведение в зависимости от заголовка
            if ($http_client_type = "web") {
                return 200 '{"status": "success", "service": "web_backend", "data": "Web application response"}';
            }
            if ($http_client_type = "mobile") {
                return 200 '{"status": "success", "service": "mobile_backend", "data": "Mobile application response"}';
            }
            
            # Дефолтный ответ
            return 200 '{"status": "success", "service": "default_backend", "data": "Default response"}';
        }
    }
} 