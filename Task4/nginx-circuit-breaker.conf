events {}

http {

    # Upstream с Circuit Breaker
    upstream logistics_backend {
        server localhost:9090 max_fails=5 fail_timeout=30s;
        server 127.0.0.1:9999 backup;  # фиктивный сервер для fallback
    }

    # API Gateway (8080)
    server {
        listen 8080;

        location /logistics/ {

            # --- Таймаут 3 секунды ---
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
            proxy_send_timeout 3s;

            # --- Считать ошибками ---
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 1;

            # --- ОБЯЗАТЕЛЬНО ---
            proxy_intercept_errors on;

            # --- Fallback ---
            error_page 500 502 503 504 = @fallback;

            proxy_pass http://logistics_backend/;
        }

        # --- Fallback endpoint ---
        location @fallback {
            add_header Content-Type application/json;
            return 200 '{"status":"fallback","message":"Logistics temporarily unavailable"}';
        }
    }
}